steps:
  # --- 1. Registry & Tool Servers (MCP) ---

  # Registry Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'conclave-registry'
      - '--source'
      - '.'
      - '--command'
      - 'python'
      - '--args'
      - 'mcp_servers/registry_server.py'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--no-allow-unauthenticated'

  # Database MCP
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'conclave-mcp-db'
      - '--source'
      - '.'
      - '--command'
      - 'python'
      - '--args'
      - 'mcp_servers/db_server.py'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,CLOUD_SQL_INSTANCE_CONNECTION_NAME=$PROJECT_ID:us-central1:postgres,CLOUD_SQL_DB_NAME=conclave_db,CLOUD_SQL_DB_USER=postgres'
      - '--set-secrets'
      - 'CLOUD_SQL_DB_PASSWORD=CLOUD_SQL_DB_PASSWORD:latest'
      - '--no-allow-unauthenticated'

  # Search MCP
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'conclave-mcp-search'
      - '--source'
      - '.'
      - '--command'
      - 'python'
      - '--args'
      - 'mcp_servers/search_server.py'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--set-secrets'
      - 'TAVILY_API_KEY=TAVILY_API_KEY:latest'
      - '--no-allow-unauthenticated'

  # Code MCP
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'conclave-mcp-code'
      - '--source'
      - '.'
      - '--command'
      - 'python'
      - '--args'
      - 'mcp_servers/code_server.py'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--no-allow-unauthenticated'

  # File System MCP
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'conclave-mcp-fs'
      - '--source'
      - '.'
      - '--command'
      - 'python'
      - '--args'
      - 'mcp_servers/fs_server.py'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'GCS_BUCKET_NAME=conclave-assets-$PROJECT_ID'
      - '--no-allow-unauthenticated'

  # --- 2. Research & Synthesizer Agents ---

  # Agent A
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'conclave-agent-a'
      - '--source'
      - 'agents/research_a'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=True,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=agent-conclave,AGENT_REGISTRY_URL=https://conclave-registry-fphbu73trq-uc.a.run.app,MCP_DB_SERVER_URL=https://conclave-mcp-db-fphbu73trq-uc.a.run.app,MCP_SEARCH_SERVER_URL=https://conclave-mcp-search-fphbu73trq-uc.a.run.app,MCP_CODE_SERVER_URL=https://conclave-mcp-code-fphbu73trq-uc.a.run.app,MCP_FS_SERVER_URL=https://conclave-mcp-fs-fphbu73trq-uc.a.run.app'
      - '--set-secrets'
      - 'LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest'
      - '--no-allow-unauthenticated'

  # Agent B
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'conclave-agent-b'
      - '--source'
      - 'agents/research_b'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=True,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=agent-conclave,AGENT_REGISTRY_URL=https://conclave-registry-fphbu73trq-uc.a.run.app,MCP_DB_SERVER_URL=https://conclave-mcp-db-fphbu73trq-uc.a.run.app,MCP_SEARCH_SERVER_URL=https://conclave-mcp-search-fphbu73trq-uc.a.run.app,MCP_CODE_SERVER_URL=https://conclave-mcp-code-fphbu73trq-uc.a.run.app,MCP_FS_SERVER_URL=https://conclave-mcp-fs-fphbu73trq-uc.a.run.app'
      - '--set-secrets'
      - 'LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest'
      - '--no-allow-unauthenticated'

  # Agent C
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'conclave-agent-c'
      - '--source'
      - 'agents/research_c'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=True,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=agent-conclave,AGENT_REGISTRY_URL=https://conclave-registry-fphbu73trq-uc.a.run.app,MCP_DB_SERVER_URL=https://conclave-mcp-db-fphbu73trq-uc.a.run.app,MCP_SEARCH_SERVER_URL=https://conclave-mcp-search-fphbu73trq-uc.a.run.app,MCP_CODE_SERVER_URL=https://conclave-mcp-code-fphbu73trq-uc.a.run.app,MCP_FS_SERVER_URL=https://conclave-mcp-fs-fphbu73trq-uc.a.run.app'
      - '--set-secrets'
      - 'LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest'
      - '--no-allow-unauthenticated'

  # Synthesizer
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'conclave-agent-synth'
      - '--source'
      - 'agents/synthesizer'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=True,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=agent-conclave,AGENT_REGISTRY_URL=https://conclave-registry-fphbu73trq-uc.a.run.app,MCP_DB_SERVER_URL=https://conclave-mcp-db-fphbu73trq-uc.a.run.app,MCP_SEARCH_SERVER_URL=https://conclave-mcp-search-fphbu73trq-uc.a.run.app,MCP_CODE_SERVER_URL=https://conclave-mcp-code-fphbu73trq-uc.a.run.app,MCP_FS_SERVER_URL=https://conclave-mcp-fs-fphbu73trq-uc.a.run.app'
      - '--set-secrets'
      - 'LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest'
      - '--no-allow-unauthenticated'

  # Viz Agent
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'conclave-agent-viz'
      - '--source'
      - 'agents/viz_agent'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=True,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=agent-conclave,AGENT_REGISTRY_URL=https://conclave-registry-fphbu73trq-uc.a.run.app,MCP_DB_SERVER_URL=https://conclave-mcp-db-fphbu73trq-uc.a.run.app,MCP_SEARCH_SERVER_URL=https://conclave-mcp-search-fphbu73trq-uc.a.run.app,MCP_CODE_SERVER_URL=https://conclave-mcp-code-fphbu73trq-uc.a.run.app,MCP_FS_SERVER_URL=https://conclave-mcp-fs-fphbu73trq-uc.a.run.app'
      - '--set-secrets'
      - 'LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest'
      - '--no-allow-unauthenticated'

  # --- 3. Orchestrator & Backend ---

  # Orchestrator
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'conclave-orchestrator'
      - '--source'
      - 'agents/orchestrator'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=True,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=agent-conclave,AGENT_REGISTRY_URL=https://conclave-registry-fphbu73trq-uc.a.run.app,MCP_DB_SERVER_URL=https://conclave-mcp-db-fphbu73trq-uc.a.run.app,MCP_SEARCH_SERVER_URL=https://conclave-mcp-search-fphbu73trq-uc.a.run.app,MCP_CODE_SERVER_URL=https://conclave-mcp-code-fphbu73trq-uc.a.run.app,MCP_FS_SERVER_URL=https://conclave-mcp-fs-fphbu73trq-uc.a.run.app,SYNTHESIZER_AGENT_CARD_URL=https://conclave-agent-synth-fphbu73trq-uc.a.run.app/a2a/agent/.well-known/agent-card.json,VIZ_AGENT_CARD_URL=https://conclave-agent-viz-fphbu73trq-uc.a.run.app/a2a/agent/.well-known/agent-card.json'
      - '--set-secrets'
      - 'LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest'
      - '--no-allow-unauthenticated'

  # Backend Gateway
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'conclave-backend'
      - '--source'
      - '.'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conclave-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'ORCHESTRATOR_URL=https://conclave-orchestrator-fphbu73trq-uc.a.run.app,GCP_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=True,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=agent-conclave,AGENT_REGISTRY_URL=https://conclave-registry-fphbu73trq-uc.a.run.app,MCP_DB_SERVER_URL=https://conclave-mcp-db-fphbu73trq-uc.a.run.app,MCP_SEARCH_SERVER_URL=https://conclave-mcp-search-fphbu73trq-uc.a.run.app,MCP_CODE_SERVER_URL=https://conclave-mcp-code-fphbu73trq-uc.a.run.app,MCP_FS_SERVER_URL=https://conclave-mcp-fs-fphbu73trq-uc.a.run.app'
      - '--set-secrets'
      - 'LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY
